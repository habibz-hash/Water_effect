<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایگاه حقیقت علمی</title>
    <style>
        /* تنظیمات پایه برای وسط‌چین کردن و ریسپانسیو بودن */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Tahoma, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* لایه پس‌زمینه با فیلتر تاریک */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://s6.uupload.ir/files/8nljqchtvomd_8nljqchtvomd.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.4);
            z-index: -1;
        }

        /* محتوای وسط صفحه */
        .content {
            text-align: center;
            color: white;
            z-index: 1;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            /* افکت درخشش آبی */
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff, 0 0 30px #00d4ff;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* استایل دکمه مدرن */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.1rem;
            text-decoration: none;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            border-radius: 50px;
            transition: all 0.4s ease;
            background: transparent;
        }

        .btn:hover {
            background-color: #00d4ff;
            color: #000;
            box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            transform: translateY(-5px);
        }

        /* تنظیمات برای موبایل */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .btn { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <h1>پایگاه حقیقت علمی</h1>
        <p>عصر جدید تبادل دانش</p>
        <a href="https://nowpayments.io/payment?payment_id=4419119672" class="btn">ورود به درگاه پرداخت و خرید</a>
    </div>

</body>
</html>
