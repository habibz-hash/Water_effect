<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<meta name="description" content="پایگاه حقیقت علمی | Archive Pro — پلتفرم غیرمتمرکز اشتراک ویدیو با مالکیت NFT">
<title>پایگاه حقیقت علمی | Archive Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#020617; --panel:#0b1220; --panel2:#111a2e;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --txt:#e8edf7; --dim:#8b9ab3;
  --brand:#6366f1; --brand2:#a855f7; --ok:#10b981; --err:#f43f5e; --gold:#f59e0b;
  --hdr:58px; --nav:66px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:Vazirmatn,system-ui,sans-serif;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
.mesh{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(circle at 12% 16%,#1e1b4b 0,transparent 42%),
  radial-gradient(circle at 88% 74%,#4c1d95 0,transparent 44%),
  radial-gradient(circle at 50% 112%,#0e7490 0,transparent 42%);}
.mesh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.35),rgba(2,6,23,.85))}
::-webkit-scrollbar{width:0;height:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
.shell{max-width:560px;margin:0 auto;position:relative;height:100%}

/* ---------- header ---------- */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:110;
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;
  background:rgba(6,10,22,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr .in{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#4f46e5,#9333ea);box-shadow:0 8px 22px -8px #6366f1}
.logo i{font-size:17px;color:#fff}
.bt{min-width:0}
.bt b{font-size:11px;font-weight:900;display:block;white-space:nowrap}
.soc{display:flex;gap:7px;font-size:9px;color:#a5b4fc;font-weight:700;margin-top:1px}
.soc a{opacity:.85}
.ha{display:flex;align-items:center;gap:6px;flex:none}
.ico{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:grid;place-items:center;font-size:13px;color:#c7d2fe;cursor:pointer;flex:none}
.ico:active{transform:scale(.94)}
.wallet{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:11px;cursor:pointer;
  border:1px solid rgba(99,102,241,.45);background:linear-gradient(135deg,rgba(79,70,229,.35),rgba(147,51,234,.28));
  font-size:10px;font-weight:800;color:#e0e7ff;white-space:nowrap}
.wallet.on{border-color:rgba(16,185,129,.5);background:linear-gradient(135deg,rgba(16,185,129,.25),rgba(5,150,105,.2));color:#a7f3d0}
.searchwrap{position:fixed;top:var(--hdr);left:0;right:0;z-index:105;display:none;
  background:rgba(6,10,22,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:9px 10px}
.searchwrap.open{display:block}
.searchwrap .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}

/* ---------- layout ---------- */
main{position:fixed;top:var(--hdr);bottom:var(--nav);left:0;right:0;overflow:hidden}
.view{display:none;height:100%;max-width:560px;margin:0 auto}
.view.active{display:block}
.pad{height:100%;overflow-y:auto;padding:14px 14px 30px}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:9px 10px;scrollbar-width:none}
.chip{padding:6px 13px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer;
  background:rgba(255,255,255,.045);border:1px solid var(--line);color:#c7d2fe}
.chip.on{background:linear-gradient(135deg,#4f46e5,#9333ea);border-color:transparent;color:#fff}

/* ---------- feed ---------- */
#feed{height:calc(100% - 48px);overflow-y:auto;scroll-snap-type:y mandatory;
  display:flex;flex-direction:column;gap:12px;padding:0 8px 24px;scrollbar-width:none}
.card{position:relative;flex:0 0 calc(100% - 4px);scroll-snap-align:center;border-radius:24px;overflow:hidden;
  background:#070d1b;border:1px solid var(--line);box-shadow:0 26px 60px -34px #000}
.card video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.shade{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.94),rgba(2,6,23,.35) 55%,transparent)}
.meta{position:absolute;bottom:14px;right:14px;left:72px;pointer-events:none}
.meta h3{font-size:14px;font-weight:800;line-height:1.5;text-shadow:0 2px 10px #000}
.meta .cr{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:#cbd5e1}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;
  background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;flex:none}
.meta .tag{display:inline-block;margin-top:7px;font-size:10px;color:#a5b4fc;background:rgba(99,102,241,.16);
  border:1px solid rgba(99,102,241,.3);border-radius:8px;padding:2px 7px}
.rail{position:absolute;left:9px;bottom:78px;display:flex;flex-direction:column;gap:11px;align-items:center;z-index:4}
.rbtn{width:43px;height:43px;border-radius:50%;border:1px solid var(--line2);background:rgba(9,14,28,.66);
  backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:14px;color:#e2e8f0;cursor:pointer}
.rbtn:active{transform:scale(.92)}
.rbtn small{font-size:9px;color:#94a3b8;font-weight:700}
.rbtn.on{color:#f43f5e;border-color:rgba(244,63,94,.55);background:rgba(244,63,94,.14)}
.rbtn.gold{color:var(--gold);border-color:rgba(245,158,11,.5)}
.badge-nft{position:absolute;top:12px;right:12px;z-index:4;display:flex;align-items:center;gap:5px;
  font-size:9.5px;font-weight:900;padding:5px 9px;border-radius:999px;color:#fff;
  background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 8px 20px -10px #f59e0b}
.badge-lock{position:absolute;top:12px;left:12px;z-index:4;font-size:9.5px;font-weight:900;padding:5px 9px;
  border-radius:999px;background:rgba(2,6,23,.75);border:1px solid var(--line2);color:#fbbf24}
.bar{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.14);z-index:5}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#a855f7)}
.lock{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:22px;background:rgba(2,6,23,.86);backdrop-filter:blur(12px)}
.lock.show{display:flex}
.lock .ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#a5b4fc;
  background:radial-gradient(circle,rgba(99,102,241,.28),transparent 70%);border:1px solid rgba(99,102,241,.4)}
.lock h4{font-size:15px;font-weight:900}
.lock p{font-size:11.5px;color:#9fb0c9;line-height:1.9;max-width:290px}
.pause{position:absolute;inset:0;z-index:3;display:none;place-items:center;font-size:46px;color:rgba(255,255,255,.75)}
.pause.show{display:grid}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);text-align:center;padding:30px}
.empty i{font-size:34px;color:#334155}

/* ---------- generic ui ---------- */
.pane{background:linear-gradient(180deg,rgba(17,26,46,.9),rgba(11,18,32,.9));border:1px solid var(--line);
  border-radius:20px;padding:14px;margin-bottom:12px}
.pane h3{font-size:12.5px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.pane h3 i{color:#818cf8}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;font-size:12.5px;outline:none;transition:.2s;user-select:text}
.inp:focus{border-color:rgba(99,102,241,.7);background:rgba(99,102,241,.07)}
textarea.inp{min-height:76px;resize:vertical;line-height:1.9}
label.lb{font-size:11px;color:var(--dim);display:block;margin:11px 0 5px;font-weight:700}
.btn{width:100%;height:44px;border:0;border-radius:14px;cursor:pointer;font-size:12.5px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#4f46e5,#9333ea);box-shadow:0 14px 30px -16px #6366f1}
.btn:active{transform:scale(.985)}
.btn.ghost{background:rgba(255,255,255,.045);border:1px solid var(--line);color:#cbd5e1;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 14px 30px -16px #10b981}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:9px}
.row>*{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:700;max-width:62%;word-break:break-all;text-align:left;user-select:text}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;direction:ltr;text-align:left;user-select:text}
.pill{font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:#cbd5e1}
.pill.ok{color:#6ee7b7;border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12)}
.pill.warn{color:#fcd34d;border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.12)}
.pill.err{color:#fda4af;border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.12)}
.copybox{background:rgba(2,6,23,.6);border:1px dashed rgba(99,102,241,.5);border-radius:13px;padding:11px;
  display:flex;align-items:center;justify-content:space-between;gap:9px}
.copybox b{font-size:12.5px;letter-spacing:.5px}
.mini{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  display:grid;place-items:center;cursor:pointer;font-size:12px;color:#c7d2fe;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
.stats div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:11px 6px}
.stats b{display:block;font-size:16px;font-weight:900}
.stats small{font-size:9.5px;color:var(--dim)}
.stars{display:flex;gap:4px;direction:ltr;justify-content:center}
.stars i{font-size:18px;color:#475569;cursor:pointer}
.stars i.on{color:var(--gold);text-shadow:0 0 12px rgba(245,158,11,.6)}
.cmt{display:flex;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.cmt .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;
  background:linear-gradient(135deg,#334155,#1e293b);color:#a5b4fc}
.cmt .bx{flex:1;min-width:0}
.cmt .hd{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);margin-bottom:3px}
.cmt p{font-size:12px;line-height:1.85;word-break:break-word;user-select:text}
.starrow{color:var(--gold);font-size:10px;direction:ltr}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.nftcard{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a1120;cursor:pointer}
.nftcard .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#111827}
.nftcard .cap{padding:9px}
.nftcard .cap b{font-size:11.5px;display:block;line-height:1.6}
.nftcard .cap span{font-size:9.5px;color:var(--dim);display:block;margin-top:3px}
.res{display:flex;gap:11px;padding:9px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);
  margin-bottom:9px;cursor:pointer;align-items:center}
.res img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:#111827}
.res b{font-size:12px;display:block;line-height:1.6}
.res small{font-size:10px;color:var(--dim)}
progress{width:100%;height:8px;border-radius:99px;appearance:none}
progress::-webkit-progress-bar{background:rgba(255,255,255,.08);border-radius:99px}
progress::-webkit-progress-value{background:linear-gradient(90deg,#4f46e5,#a855f7);border-radius:99px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);z-index:110;
  background:rgba(6,10,22,.86);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .in{max-width:560px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-around}
.navbtn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9.5px;font-weight:700;color:#64748b;cursor:pointer;padding:6px 10px}
.navbtn i{font-size:17px}
.navbtn.active{color:#818cf8}
.navbtn.plus i{font-size:27px;background:linear-gradient(135deg,#4f46e5,#9333ea);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:130;display:none}
.sheet-wrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(2,6,23,.82);backdrop-filter:blur(9px)}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:linear-gradient(180deg,#101a2f,#080e1c);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:up .3s ease}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h2{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:8px}
.shead h2 i{color:#818cf8}
.grab{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.toast{position:fixed;top:calc(var(--hdr) + 12px);left:50%;transform:translate(-50%,-16px);opacity:0;
  transition:.28s;z-index:300;padding:10px 15px;border-radius:14px;background:rgba(15,23,42,.97);
  border:1px solid var(--line2);font-size:11.5px;max-width:92vw;text-align:center;pointer-events:none;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(16,185,129,.55);color:#6ee7b7}
.toast.err{border-color:rgba(244,63,94,.55);color:#fda4af}
.toast.info{border-color:rgba(99,102,241,.55);color:#c7d2fe}
.codeblock{background:#020617;border:1px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;
  font-family:ui-monospace,monospace;font-size:10px;direction:ltr;text-align:left;line-height:1.75;
  max-height:280px;white-space:pre;user-select:text;color:#a5f3fc}
.hint{font-size:10.5px;color:var(--dim);line-height:1.95}
.stack{display:flex;flex-direction:column;gap:9px}
</style>
</head>
<body>
<div class="mesh"></div>

<header class="hdr">
  <div class="in">
    <div class="brand">
      <div class="logo"><i class="fas fa-atom"></i></div>
      <div class="bt">
        <b>پایگاه حقیقت علمی</b>
        <div class="soc">
          <a href="https://ble.ir/habibz" target="_blank" rel="noopener">بله</a>
          <a href="https://t.me/habibz" target="_blank" rel="noopener">تلگرام</a>
          <a href="https://instagram.com/habibz" target="_blank" rel="noopener">اینستاگرام</a>
        </div>
      </div>
    </div>
    <div class="ha">
      <button class="ico" id="btn-mute" data-act="mute" title="صدا"><i class="fas fa-volume-xmark"></i></button>
      <button class="ico" id="btn-search" data-act="search-toggle" title="جستجو"><i class="fas fa-magnifying-glass"></i></button>
      <button class="wallet" id="btn-wallet" data-act="wallet"><i class="fas fa-wallet"></i><span id="wallet-label">اتصال کیف پول</span></button>
    </div>
  </div>
</header>

<div class="searchwrap" id="searchwrap">
  <div class="in">
    <input class="inp" id="search" placeholder="جستجوی ویدیو، سازنده، موضوع، برچسب...">
    <button class="ico" data-act="search-toggle"><i class="fas fa-xmark"></i></button>
  </div>
</div>

<main>
  <section class="view active" id="view-feed">
    <div class="chips" id="cat-chips"></div>
    <div id="feed"></div>
  </section>
  <section class="view" id="view-search"><div class="pad" id="search-results"></div></section>
  <section class="view" id="view-nft"><div class="pad" id="nft-grid"></div></section>
  <section class="view" id="view-profile"><div class="pad" id="profile"></div></section>
</main>

<nav class="nav">
  <div class="in">
    <button class="navbtn active" data-act="view" data-view="feed"><i class="fas fa-house"></i><span>خانه</span></button>
    <button class="navbtn" data-act="view" data-view="search"><i class="fas fa-magnifying-glass"></i><span>جستجو</span></button>
    <button class="navbtn plus" data-act="creator"><i class="fas fa-circle-plus"></i><span>ارسال</span></button>
    <button class="navbtn" data-act="view" data-view="nft"><i class="fas fa-gem"></i><span>NFT</span></button>
    <button class="navbtn" data-act="view" data-view="profile"><i class="fas fa-user"></i><span>من</span></button>
  </div>
</nav>

<div class="sheet-wrap" id="sheet-wallet"><div class="scrim" data-act="close"></div><div class="sheet" id="wallet-body"></div></div>
<div class="sheet-wrap" id="sheet-pay"><div class="scrim" data-act="close"></div><div class="sheet" id="pay-body"></div></div>
<div class="sheet-wrap" id="sheet-creator"><div class="scrim" data-act="close"></div><div class="sheet">
  <div class="grab"></div>
  <div class="shead"><h2><i class="fas fa-cloud-arrow-up"></i> مرکز سازنده</h2><button class="mini" data-act="close"><i class="fas fa-xmark"></i></button></div>
  <label class="lb">عنوان ویدیو *</label>
  <input class="inp" id="ct-title" maxlength="90" placeholder="مثال: تحلیل عمیق شبکه‌های غیرمتمرکز">
  <label class="lb">توضیح</label>
  <textarea class="inp" id="ct-desc" maxlength="400" placeholder="خلاصه محتوا..."></textarea>
  <div class="row">
    <div><label class="lb">دسته‌بندی</label><select class="inp" id="ct-cat"></select></div>
    <div><label class="lb">قیمت (USDT)</label><input class="inp" id="ct-price" type="number" min="0" step="0.5" value="0"></div>
  </div>
  <label class="lb">برچسب‌ها (با کاما جدا کنید)</label>
  <input class="inp" id="ct-tags" placeholder="Web3, NFT, آموزش">
  <label class="lb">فایل ویدیو * (توصیه: زیر ۱۰۰ مگابایت، MP4)</label>
  <input class="inp" id="ct-file" type="file" accept="video/mp4,video/webm,video/quicktime">
  <label class="lb">امنیت و درآمد</label>
  <div class="pane" style="margin:0 0 10px">
    <div class="kv"><span>قفل محتوا (فروش تک‌ویدیو)</span><span id="ct-locktext">غیرفعال — قیمت را وارد کنید</span></div>
    <div class="kv"><span>ثبت روی IPFS</span><span id="ct-ipfs">آماده</span></div>
    <div class="kv"><span>هش محتوا (SHA-256)</span><span class="mono" id="ct-hash">—</span></div>
  </div>
  <progress id="ct-progress" value="0" max="100" style="display:none"></progress>

<script type="text/plain" id="sol-src">// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

import "@openzeppelin/contracts/token/ERC721/extensions/ERC721URIStorage.sol";
import "@openzeppelin/contracts/access/Ownable.sol";
import "@openzeppelin/contracts/utils/ReentrancyGuard.sol";

contract ArchiveProContent is ERC721URIStorage, Ownable, ReentrancyGuard {
    uint256 private _nextId = 1;

    struct Content {
        string contentHash;
        uint256 price;
        address creator;
        bool active;
    }

    mapping(uint256 => Content) public contents;
    mapping(uint256 => mapping(address => bool)) public unlocked;

    event ContentMinted(uint256 indexed tokenId, address indexed creator, string uri, uint256 price);
    event Unlocked(uint256 indexed tokenId, address indexed buyer, uint256 amount);

    constructor() ERC721("Archive Pro Content", "APC") Ownable(msg.sender) {}

    function mintContent(address to, string calldata uri, uint256 price, string calldata contentHash)
        external onlyOwner returns (uint256)
    {
        uint256 id = _nextId++;
        _safeMint(to, id);
        _setTokenURI(id, uri);
        contents[id] = Content(contentHash, price, to, true);
        emit ContentMinted(id, to, uri, price);
        return id;
    }

    function unlock(uint256 tokenId) external payable nonReentrant {
        Content memory c = contents[tokenId];
        require(c.active, "content inactive");
        require(msg.value >= c.price, "insufficient value");
        require(!unlocked[tokenId][msg.sender], "already unlocked");
        unlocked[tokenId][msg.sender] = true;
        emit Unlocked(tokenId, msg.sender, msg.value);
    }

    function setPrice(uint256 tokenId, uint256 price) external {
        require(contents[tokenId].creator == msg.sender || owner() == msg.sender, "not allowed");
        contents[tokenId].price = price;
    }

    function totalSupply() external view returns (uint256) {
        return _nextId - 1;
    }

    function withdraw() external onlyOwner nonReentrant {
        (bool ok, ) = owner().call{value: address(this).balance}("");
        require(ok, "transfer failed");
    }
}
</script>
