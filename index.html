<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Neon Page</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* فونت مدرن سیستم */
            overflow: hidden; /* جلوگیری از اسکرول برای تک‌صفحه‌ای بودن */
        }

        /* شرط اول: پس‌زمینه تمام صفحه، Cover و ثابت */
        body {
            background-image: url('https://s6.uupload.ir/files/8nljqchtvomd-hl_fwp_w8_4ecg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            /* شرط دوم: تراز کردن محتوا در مرکز */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* شرط دوم: استایل متن‌های نئونی آبی فسفری */
        .container {
            padding: 20px;
        }

        h1, p, span {
            color: #00f3ff; /* رنگ آبی فسفری نئونی */
            text-shadow: 
                0 0 5px #00f3ff,
                0 0 10px #00f3ff,
                0 0 20px #00f3ff; /* ایجاد افکت درخشش نئونی */
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* استایل فرضی برای المان‌های بعدی */
        .content-box {
            background: rgba(0, 0, 0, 0.4); /* پس‌زمینه نیمه‌شفاف برای خوانایی بهتر متن روی تصویر */
            padding: 3rem;
            border-radius: 15px;
            backdrop-filter: blur(5px); /* افکت شیشه‌ای */
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-box">
            <!-- بخش محتوا در دستورات بعدی تکمیل خواهد شد -->
            <h1>آماده دریافت دستور بعدی...</h1>
        </div>
    </div>

</body>
</html>
